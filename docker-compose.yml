services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mysite-server
    restart: unless-stopped
    ports:
      - "${SERVER_HOST_PORT:-56300}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /app/data/framework.sqlite
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置不少于 32 位的 JWT_SECRET}
      SETUP_KEY: ${SETUP_KEY:?请在 .env 中设置不少于 16 位的 SETUP_KEY}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:56808}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mysite-net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: mysite-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-56808}:8080"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - mysite-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:56080}
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    container_name: mysite-client
    restart: unless-stopped
    ports:
      - "${CLIENT_HOST_PORT:-56080}:80"
    environment:
      PORT: 80
      HOSTNAME: 0.0.0.0
      SERVER_INTERNAL_URL: http://server:3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:56080}
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      server:
        condition: service_healthy
    networks:
      - mysite-net

networks:
  mysite-net:
    driver: bridge
