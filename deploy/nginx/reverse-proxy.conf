# ==============================================================================
# Nginx 反向代理区块模板（按需复制对应 location 区块到你的站点 server {} 中）
# 容器宿主机映射端口：
#   - 用户端 (client): 127.0.0.1:56080 -> 容器 :80
#   - 管理端 (admin) : 127.0.0.1:56808 -> 容器 :8080
#   - 服务端 (server): 127.0.0.1:56300 -> 容器 :3000
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 用户端站点（放入用户端域名 server {} 区块内）
# ------------------------------------------------------------------------------
client_max_body_size 20m;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:56300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://127.0.0.1:56300/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location / {
    proxy_pass http://127.0.0.1:56080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# ------------------------------------------------------------------------------
# 2. 管理端站点（放入管理端域名 server {} 区块内）
# 注意：使用 /api/v1/ 或带斜杠 /api/，不要写无斜杠的 location /api，
#       否则会误拦截管理端前端路由 /api-docs。
# ------------------------------------------------------------------------------
client_max_body_size 20m;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:56300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://127.0.0.1:56300/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location / {
    proxy_pass http://127.0.0.1:56808;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
