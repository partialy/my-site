name: Build and Push Server Image

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/docker-server.yml'
  workflow_dispatch:

concurrency:
  group: docker-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Server (linux/amd64)
    runs-on: ubuntu-latest
    environment: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_RPO_NAME: ${{ secrets.ACR_RPO_NAME }}
        run: |
          if [ -z "$ACR_REGISTRY" ] || [ -z "$ACR_NAMESPACE" ] || [ -z "$ACR_RPO_NAME" ]; then
            echo "::error::Missing ACR_REGISTRY, ACR_NAMESPACE or ACR_RPO_NAME in environment 'build' secrets."
            exit 1
          fi
          IMAGE_REPO=$(printf '%s/%s/%s' "$ACR_REGISTRY" "$ACR_NAMESPACE" "$ACR_RPO_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "image=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}:server-latest
            ${{ steps.meta.outputs.image }}:server-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
