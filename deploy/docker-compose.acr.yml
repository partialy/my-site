# ==============================================================================
# 阿里云 ACR 成品镜像部署模板（配合 GitHub Actions 自动构建的 server-latest / client-latest）
# 使用前在同目录 .env 中配置 ACR_IMAGE、JWT_SECRET、SETUP_KEY、ADMIN_ORIGIN、NEXT_PUBLIC_SITE_URL
# 示例：ACR_IMAGE=crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com/your-ns/your-repo
# 首次拉取私有仓库需先执行：docker login <ACR_REGISTRY>
# 更新服务命令：docker compose -f docker-compose.acr.yml pull && docker compose -f docker-compose.acr.yml up -d
# ==============================================================================

services:
  server:
    image: ${ACR_IMAGE:?请在 .env 中配置 ACR_IMAGE}:server-latest
    container_name: mysite-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-56300}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /app/data/framework.sqlite
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置不少于 32 位的 JWT_SECRET}
      SETUP_KEY: ${SETUP_KEY:?请在 .env 中设置不少于 16 位的 SETUP_KEY}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://www-admin.hs.partialy.cn}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mysite-net

  client:
    image: ${ACR_IMAGE:?请在 .env 中配置 ACR_IMAGE}:client-latest
    container_name: mysite-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_HOST_PORT:-56080}:80"
    environment:
      PORT: 80
      HOSTNAME: 0.0.0.0
      SERVER_INTERNAL_URL: http://server:3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.partialy.cn}
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      server:
        condition: service_healthy
    networks:
      - mysite-net

networks:
  mysite-net:
    driver: bridge
